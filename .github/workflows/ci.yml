name: ci
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha --grep pattern to run a subset of tests'
        required: false
        default: ''
permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://:2026-06-15T10%3A46%3A12.880000Z@time-machines-npm.sealsecurity.io/

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'

      - name: Install Node.js dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Lint code
        run: npm run lint

  test:
    name: Test - Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.0.0, 18, 19, 20, 21, 22, 23, 24, 25, 26]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true

      - name: Install Node.js dependencies
        run: npm install

      - name: Run tests
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            npm test -- --grep "$TEST_FILTER"
          else
            npm run test-ci
          fi

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Pack tarball
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ./body-parser-*.tgz
          if-no-files-found: error
